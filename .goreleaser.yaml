version: 2

project_name: dhctl

before:
  hooks:
    - go mod tidy

builds:
  - id: dhctl
    binary: dhctl
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dorkitude/dhctl/cmd.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - dhctl
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  disable: true
