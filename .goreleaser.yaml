version: 2

project_name: dhctl

before:
  hooks:
    - go mod tidy

builds:
  - id: dhctl
    binary: dhctl
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/dorkitude/dhctl/cmd.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# One macOS binary for Apple Silicon and Intel (dhctl_X_darwin_all.tar.gz),
# which the Homebrew cask installs. The per-arch darwin archives stay too.
universal_binaries:
  - id: dhctl
    ids: [dhctl]
    replace: false

# Sign the macOS binaries with the Developer ID certificate and notarize them
# with Apple (runs on Linux via quill). Skipped when the secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [dhctl]
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - id: default
    ids:
      - dhctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

# Ubuntu/Debian (.deb) and Fedora/RHEL (.rpm) packages, attached to the release.
# scripts/publish-apt.sh also signs the .debs into dorkitude/dhctl-apt.
nfpms:
  - id: packages
    package_name: dhctl
    ids:
      - dhctl
    formats:
      - deb
      - rpm
    vendor: Kyle Wild
    maintainer: Kyle Wild <kyle@kylewild.com>
    homepage: https://github.com/dorkitude/dhctl
    description: |-
      CLI for the DreamHost API: DNS records, announcement lists and the API
      metacommands.
    license: MIT
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/dhctl/LICENSE

checksum:
  name_template: checksums.txt

release:
  name_template: "dhctl {{ .Tag }}"

changelog:
  disable: true
